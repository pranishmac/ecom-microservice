spring.application.name=ecom-application

spring.datasource.url=jdbc:h2:mem:ecomdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console/

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Graceful shutdown: let in-flight requests finish (up to the timeout) instead of
# dropping them on SIGTERM. Independent of, and unrelated to, actuator's /shutdown
# endpoint below - this is what an orchestrator (k8s, systemd) actually triggers.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Actuator runs on its own port, separate from the public API (server.port=8080).
# The security boundary is "port 8081 is not exposed outside the deployment network"
# (firewall / container port mapping / k8s NetworkPolicy) - Spring cannot enforce
# that itself, so this only holds if the deployer actually keeps 8081 internal.
management.server.port=8081

management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers,beans,env,mappings,shutdown

# Full health detail is safe to show here since health is only reachable on the
# isolated management port, not the public one.
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# All other exposed endpoints default to read/write ("unrestricted") access the
# moment they're in the exposure list above - shutdown is the one deliberate
# exception Spring Boot ships disabled by default, so it needs an explicit opt-in.
management.endpoint.shutdown.access=unrestricted

management.info.env.enabled=true
management.info.build.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

info.app.name=${spring.application.name}
info.app.description=E-commerce backend: users, product catalog, cart, and orders.
